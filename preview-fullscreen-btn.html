<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选项卡最终方案</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #0a1a30 0%, #050d18 60%, #020810 100%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Microsoft YaHei', sans-serif; gap: 24px;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(28,177,195,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(28,177,195,0.025) 1px, transparent 1px);
    background-size: 36px 36px;
  }

  .container { display: flex; gap: 40px; align-items: flex-start; z-index: 1; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .col-name {
    color: #00e5ff; font-size: 12px; letter-spacing: 3px; font-weight: bold;
    text-shadow: 0 0 8px rgba(0,229,255,0.4);
  }
  .panel {
    background: rgba(6,20,38,0.92);
    border: 1px solid rgba(28,177,195,0.15);
    padding: 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    position: relative;
  }
  .panel::before, .panel::after {
    content: ''; position: absolute;
    width: 12px; height: 12px; border-color: rgba(28,177,195,0.35); border-style: solid;
  }
  .panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .panel::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
  .divider {
    width: 1px; align-self: stretch;
    background: linear-gradient(180deg, transparent, rgba(28,177,195,0.12), transparent);
  }

  /* 全屏按钮 */
  .btn-fs {
    position: relative; width: 40px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; margin-bottom: 6px;
  }
  .btn-fs .p { position: absolute; inset: 0; pointer-events: none; z-index: 3; opacity: 1; }
  .btn-fs .d {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 5px 2px rgba(0,229,255,0.8), 0 0 10px 3px rgba(0,229,255,0.35);
  }
  .dt{top:-2px;left:-2px;animation:ta 3s linear infinite}
  .dr{top:-2px;right:-2px;animation:tr 3s linear infinite}
  .db{bottom:-2px;right:-2px;animation:tb 3s linear infinite}
  .dl{bottom:-2px;left:-2px;animation:tl 3s linear infinite}
  @keyframes ta{0%{top:-2px;left:-2px;opacity:0}5%{opacity:1}25%{top:-2px;left:calc(100% - 2px);opacity:1}30%{opacity:0}100%{top:-2px;left:-2px;opacity:0}}
  @keyframes tr{25%{top:-2px;right:-2px;opacity:0}30%{opacity:1}50%{top:calc(100% - 2px);right:-2px;opacity:1}55%{opacity:0}100%{top:-2px;right:-2px;opacity:0}}
  @keyframes tb{50%{bottom:-2px;right:-2px;opacity:0}55%{opacity:1}75%{bottom:-2px;right:calc(100% - 2px);opacity:1}80%{opacity:0}100%{bottom:-2px;right:-2px;opacity:0}}
  @keyframes tl{75%{bottom:-2px;left:-2px;opacity:0}80%{opacity:1}100%{bottom:calc(100% - 2px);left:-2px;opacity:1}}

  .btn-fs .c {
    width: 36px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(28,177,195,0.1);
    border: 1px solid rgba(28,177,195,0.6);
    clip-path: polygon(5px 0, calc(100% - 5px) 0, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 0 calc(100% - 5px), 0 5px);
    box-shadow: 0 0 12px rgba(28,177,195,0.3);
    transition: all 0.3s ease; position: relative; z-index: 1;
  }
  .btn-fs .c svg { width: 18px; height: 18px; color: #00e5ff; filter: drop-shadow(0 0 6px rgba(0,229,255,0.7)); }

  /* ================================================================
     方案 A: 浮动胶囊滑块
     ================================================================ */
  .capsule-bar {
    display: flex; position: relative;
    background: rgba(6,18,35,0.9);
    border: 1px solid rgba(28,177,195,0.15);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .capsule-bar .tab {
    width: 70px; height: 28px; line-height: 28px; text-align: center;
    border-radius: 18px;
    color: rgba(255,255,255,0.4); font-size: 13px;
    cursor: default; user-select: none; position: relative; z-index: 1;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .capsule-bar .tab:hover { color: rgba(255,255,255,0.7); }
  .capsule-bar .tab.active {
    color: #00e5ff; font-weight: bold;
    text-shadow: 0 0 8px rgba(0,229,255,0.5);
    background: rgba(28,177,195,0.18);
    box-shadow: 0 0 10px rgba(28,177,195,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* ================================================================
     方案 B: 斜面仪表盘式
     ================================================================ */
  .dash-tabs {
    display: flex; gap: 0; align-items: stretch;
  }
  .dash-tabs .tab {
    width: 70px; height: 30px; line-height: 30px; text-align: center;
    background: rgba(6,18,35,0.7);
    border: 1px solid rgba(28,177,195,0.12);
    border-right: none;
    color: rgba(255,255,255,0.4); font-size: 13px;
    cursor: default; user-select: none; position: relative;
    transition: all 0.3s ease;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0% 100%);
  }
  .dash-tabs .tab:first-child { clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0% 100%); }
  .dash-tabs .tab:last-child {
    border-right: 1px solid rgba(28,177,195,0.12);
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0% 100%);
  }
  .dash-tabs .tab:hover {
    color: rgba(255,255,255,0.7);
    background: rgba(28,177,195,0.06);
  }
  .dash-tabs .tab.active {
    color: #00e5ff; font-weight: bold;
    text-shadow: 0 0 8px rgba(0,229,255,0.5);
    background: rgba(28,177,195,0.15);
    border-color: rgba(28,177,195,0.4);
    box-shadow: 0 0 10px rgba(28,177,195,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
    z-index: 2;
  }

  /* ================================================================
     方案 C: 发光 LED 刻度式
     ================================================================ */
  .led-tabs {
    display: flex; gap: 16px; align-items: center;
  }
  .led-tabs .tab {
    text-align: center; position: relative; padding: 2px 6px 8px;
    color: rgba(255,255,255,0.35); font-size: 14px; letter-spacing: 1px;
    cursor: default; user-select: none;
    transition: all 0.3s ease;
  }
  /* 下方刻度线 */
  .led-tabs .tab::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 20px; height: 2px;
    background: rgba(28,177,195,0.15);
    transition: all 0.3s ease;
  }
  /* 刻度两端小亮点 */
  .led-tabs .tab::before {
    content: ''; position: absolute; bottom: -3px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-radius: 50%;
    background: #00e5ff;
    transition: all 0.35s ease;
  }
  .led-tabs .tab:hover { color: rgba(255,255,255,0.65); }
  .led-tabs .tab:hover::after { background: rgba(28,177,195,0.35); }
  .led-tabs .tab.active {
    color: #00e5ff; font-weight: bold;
    text-shadow: 0 0 10px rgba(0,229,255,0.5);
  }
  .led-tabs .tab.active::after {
    width: 40px; height: 2px;
    background: #00e5ff;
    box-shadow: 0 0 8px rgba(0,229,255,0.6), 0 0 2px rgba(0,229,255,0.8);
  }
  .led-tabs .tab.active::before {
    width: 5px; height: 5px; bottom: -4px;
    box-shadow: 0 0 8px 3px rgba(0,229,255,0.7);
  }

  .hint-bar {
    position: fixed; bottom: 36px; z-index: 1;
    color: rgba(255,255,255,0.2); font-size: 13px; letter-spacing: 1px;
  }
  .hint-bar span { color: rgba(0,229,255,0.5); }
</style>
</head>
<body>

<div class="container">

  <!-- A: 浮动胶囊 -->
  <div class="col">
    <div class="col-name">A · 浮动胶囊</div>
    <div class="panel">
      <div class="btn-fs">
        <div class="p"><span class="d dt"></span><span class="d dr"></span><span class="d db"></span><span class="d dl"></span></div>
        <div class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><polyline points="21 3 14 10"/><polyline points="3 21 10 14"/></svg></div>
      </div>
      <div class="capsule-bar">
        <div class="tab">总览</div>
        <div class="tab active">水情</div>
        <div class="tab">雨情</div>
        <div class="tab">流量</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- B: 斜面仪表盘 -->
  <div class="col">
    <div class="col-name">B · 斜面仪表</div>
    <div class="panel">
      <div class="btn-fs">
        <div class="p"><span class="d dt"></span><span class="d dr"></span><span class="d db"></span><span class="d dl"></span></div>
        <div class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><polyline points="21 3 14 10"/><polyline points="3 21 10 14"/></svg></div>
      </div>
      <div class="dash-tabs">
        <div class="tab">总览</div>
        <div class="tab active">水情</div>
        <div class="tab">雨情</div>
        <div class="tab">流量</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- C: LED刻度 -->
  <div class="col">
    <div class="col-name">C · LED 刻度</div>
    <div class="panel">
      <div class="btn-fs">
        <div class="p"><span class="d dt"></span><span class="d dr"></span><span class="d db"></span><span class="d dl"></span></div>
        <div class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><polyline points="21 3 14 10"/><polyline points="3 21 10 14"/></svg></div>
      </div>
      <div class="led-tabs">
        <div class="tab">总览</div>
        <div class="tab active">水情</div>
        <div class="tab">雨情</div>
        <div class="tab">流量</div>
      </div>
    </div>
  </div>

</div>

<div class="hint-bar">3 种全新结构 &nbsp;|&nbsp; <span>A</span> 圆角胶囊滑动 &nbsp;|&nbsp; <span>B</span> 平行四边形斜面 &nbsp;|&nbsp; <span>C</span> LED刻度灯带</div>

</body>
</html>
